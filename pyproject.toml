[project]
name = "tianqi-maintenance"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
include = ["tests/**/*.py", "custom_components/tianqi/timestamps.py"]

[tool.ruff.lint.per-file-ignores]
"tests/test_timestamps.py" = ["DTZ001"] # Expected provider-local calendar values.
