name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
